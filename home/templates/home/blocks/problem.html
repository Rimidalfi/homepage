{% load wagtailcore_tags wagtailimages_tags%} 

<section id="{{value.anchor}}" class="bg-amber-200 flex flex-col md:flex-row px-20 md:px-40 py-20 gap-12">

    {% if value.cards %}
    <div class="flex flex-col md:justify-center gap-4 md:w-4/6 md:-translate-y-8">
    {% else %}
    <div class="flex flex-col md:justify-center gap-4 ">
    {% endif %}

    <span class="badge badge-md">{{value.tag}}</span>
    <h2 class="text-5xl text-mist-900">{{value.heading}}</h2>
    <h3 class="text-2xl text-mist-700">{{value.paragraph}}</h3>
    </div>

    {% if value.cards %}

        <div class="flex flex-col items-center justify-center gap-4 md:w-2/6 md:gap-1">
            {% for card in value.cards  %}

                    {% include_block card %}
 
            {% endfor %}
        </div>

    {% endif %}

</section>
